<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="100%">
  <rect width="1100" height="220" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Card 1 -->
  <rect x="24" y="24" width="336" height="172" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="44" y="52" fill="#ef4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">AVAILABLE 01 · NATIVE ELF</text>
  <text x="44" y="78" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Import + Mitigation Triage</text>
  <text x="44" y="106" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Bounded native extraction surfaces imports,</text>
  <text x="44" y="124" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">strings and security signals for manual</text>
  <text x="44" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">follow-up; a sink import is not a bug.</text>
  <text x="44" y="174" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Status: candidate · no exploit score</text>

  <!-- Card 2 -->
  <rect x="382" y="24" width="336" height="172" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="402" y="52" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">METADATA 02 · ELECTRON / ASAR</text>
  <text x="402" y="78" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Archive Index Only</text>
  <text x="402" y="106" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Lists bounded file entries and offsets.</text>
  <text x="402" y="124" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">No JS AST, IPC messages, or broker flow</text>
  <text x="402" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">is decoded from these archive headers.</text>
  <text x="402" y="174" fill="#d8b4fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Status: metadata-only</text>

  <!-- Card 3 -->
  <rect x="740" y="24" width="336" height="172" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="760" y="52" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">METADATA 03 · FIRMWARE</text>
  <text x="760" y="78" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Image Extraction</text>
  <text x="760" y="106" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Locates an ELF magic marker only.</text>
  <text x="760" y="124" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">No firmware unpacking or ELF validity</text>
  <text x="760" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">check; extract executables separately.</text>
  <text x="760" y="174" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Status: metadata-only</text>
</svg>
